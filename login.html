<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Lab Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:28px;width:90%;max-width:380px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.12);text-align:center}
input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{padding:11px 22px;border:0;border-radius:8px;cursor:pointer}
#result{margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>Security Lab Login</h1>
<p>Dummy login for ethical security practice.</p>
<form id="loginForm">
<input id="username" type="text" placeholder="Username" autocomplete="off">
<input id="password" type="password" placeholder="Dummy password" autocomplete="off">
<button type="submit">Login</button>
</form>
<p id="result"></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();
  document.getElementById("result").textContent =
    "Demo login only. No password was stored or transmitted.";
});
</script>
</body>
</html>
